<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Жаттығу | Қауіпсіз шешім зертханасы</title>

    <link rel="stylesheet" href="./style.css?v=50">
</head>

<body>

<div class="container">

    <header class="hero small-hero">
        <div class="hero-label">
            ИНТЕРАКТИВТІ ЖАТТЫҒУ
        </div>

        <h1>
            Бір жағдаят. Үш шешім.
        </h1>

        <p>
            Қай әрекет қауіпсіз екенін өзің анықта
        </p>
    </header>


    <nav class="navigation">
        <a href="index.html" class="nav-link">Басты бет</a>
        <a href="diagnostic.html" class="nav-link">Диагностика</a>
        <a href="situations.html" class="nav-link">12 жағдаят</a>
        <a href="practice.html" class="nav-link active">Жаттығу</a>
        <a href="helper.html" class="nav-link">Көмекші</a>
        <a href="teacher.html" class="nav-link">Мұғалімге</a>
    </nav>


    <main class="practice-shell">

        <div class="practice-toolbar">

            <div>
                <span id="practiceCategory" class="practice-category"></span>
                <span id="practiceSkill" class="practice-skill"></span>
            </div>

            <div class="practice-count">
                <strong id="practiceCurrent">01</strong>
                <span>/ 12</span>
            </div>

        </div>


        <div class="practice-progress-track">
            <div id="practiceProgressFill"></div>
        </div>


        <section class="practice-scene">

            <div class="practice-scene-number" id="sceneNumber">
                01
            </div>

            <div class="practice-scene-content">

                <span>
                    ЖАҒДАЯТ
                </span>

                <h2 id="practiceTitle"></h2>

                <p id="practiceText"></p>

            </div>

        </section>


        <section>

            <div class="practice-question-title">
                Сенің алғашқы әрекетің қандай?
            </div>

            <div id="practiceOptions" class="practice-choice-grid"></div>

        </section>


        <section id="practiceFeedback" class="practice-feedback hidden">

            <div class="feedback-result-icon" id="feedbackIcon">
                ✓
            </div>

            <div>

                <span id="feedbackLabel">
                    ҚАУІПСІЗ ШЕШІМ
                </span>

                <h3 id="feedbackHeading"></h3>

                <p id="feedbackText"></p>

            </div>

        </section>


        <section id="practicePhrase" class="practice-phrase-panel hidden">

            <div>

                <span>
                    ЕРЕСЕККЕ ҚАЛАЙ АЙТАМЫН?
                </span>

                <p id="phraseText"></p>

            </div>

            <button onclick="speakPhrase()">
                ▶ Тыңдау
            </button>

        </section>


        <div id="practiceNext" class="practice-next hidden">

            <button onclick="nextSituation()" class="primary-btn">
                Келесі жағдаят →
            </button>

        </div>

    </main>

</div>


<script src="./situations.js"></script>
<script src="./practice.js?v=50"></script>

</body>
</html>
